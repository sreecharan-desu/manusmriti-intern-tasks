[project]
name = "upload-api"
version = "0.1.0"
description = "File upload API with type, size, and local storage checks."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pymongo>=4.10",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
]

[project.scripts]
upload-api = "upload_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app:app"
