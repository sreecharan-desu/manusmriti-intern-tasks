[project]
name = "auth-service"
version = "0.1.0"
description = "JWT auth service with bcrypt password hashing."
requires-python = ">=3.12"
dependencies = [
  "bcrypt>=4.0",
  "fastapi>=0.115",
  "pydantic[email]>=2.0",
  "PyJWT>=2.9",
  "uvicorn>=0.32",
]

[project.scripts]
auth-service = "auth_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "app:app"
